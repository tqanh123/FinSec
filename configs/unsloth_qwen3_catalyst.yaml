base_model: "unsloth/Qwen3-1.7B-bnb-4bit"
max_seq_length: 4096
load_in_4bit: true
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  learning_rate: 0.0002
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  optim: "adamw_8bit"
  report_to: "wandb"
