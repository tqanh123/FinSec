# Phase DAG for plan 261021-1314-phase0b-foundations — strictly linear (P1 -> P2 -> P3 -> P4 -> P5).
# {from: A, to: B} = A runs BEFORE B. Every phase also writes AGENTS.md and the three docs, so no pair may run in parallel.
# files_to_* mirror each phase file's "Related Code Files" table exactly (read/run rows excluded).
edges:
  - {from: P1, to: P2}
  - {from: P2, to: P3}
  - {from: P3, to: P4}
  - {from: P4, to: P5}
subtasks:
