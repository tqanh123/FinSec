# Phase DAG for plan 261022-1147-phase0a-capture — strictly linear (P1 -> P2 -> P3 -> P4 -> P5 -> P6 -> P7).
# {from: A, to: B} = A runs BEFORE B. Every phase writes AGENTS.md (and most write the three docs), so no pair may run
# in parallel without a merger_owned list for those files; with one developer the gain is nil.
# files_to_* mirror each phase file's "Related Code Files" table exactly (read/run rows excluded).
#
# Cross-plan edges: every phase here touches tests/, pyproject.toml or AGENTS.md, which plan
# 261021-1314-phase0b-foundations also writes. That plan is strictly linear P1 -> P5; its P1 was the last phase to
# write pyproject.toml and its P5 the last to write tests/ and AGENTS.md, so P5 (the chain's end, which implies P1)
# is the single prerequisite each phase here waits on. If the 0b plan is archived before cook, rewrite each `from:`
# to `archive/261021-1314-phase0b-foundations/P5` (one line each) rather than waiving the edge.
edges:
  - {from: 261021-1314-phase0b-foundations/P5, to: P1}
  - {from: 261021-1314-phase0b-foundations/P5, to: P2}
  - {from: 261021-1314-phase0b-foundations/P5, to: P3}
  - {from: 261021-1314-phase0b-foundations/P5, to: P4}
  - {from: 261021-1314-phase0b-foundations/P5, to: P5}
  - {from: 261021-1314-phase0b-foundations/P5, to: P6}
  - {from: 261021-1314-phase0b-foundations/P5, to: P7}
  - {from: P1, to: P2}
  - {from: P2, to: P3}
  - {from: P3, to: P4}
  - {from: P4, to: P5}
  - {from: P5, to: P6}
  - {from: P6, to: P7}
subtasks:
  P1:
    file: phases/phase-1-vnstock-probe.md
    post: [verification-P1.json]
    files_to_create:
      - src/finsec_alpharadar/data_root.py
      - tests/test_data_root.py
      - tests/test_dependency_pins.py
      - requirements/vnstock/pyproject.toml
      - requirements/vnstock/win-py313.lock
      - scripts/spike/_spikelib.py
      - scripts/spike/vnstock_probe.py
      - scripts/spike/portal_probe.py
      - docs/phase0-spike-report.md
    files_to_modify:
      - pyproject.toml
      - .env.example
      - AGENTS.md
      - docs/system-architecture.md
      - docs/code-standards.md
      - docs/project-roadmap.md
  P2:
