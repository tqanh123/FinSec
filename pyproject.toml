[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsec-alpharadar"
version = "0.1.0"
description = "Dual-Market (US SEC/Alpaca & Vietnam HOSE/HNX/SSI/Vnstock) Real-Time Quant & Hybrid RAG Copilot"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
    "tzdata",
]

[project.optional-dependencies]
prod = [
    "pathway>=0.32.0",
    "qdrant-client>=1.12.0",
    "psycopg[binary]>=3.2.0",
    "edgartools>=3.0.0",
    "pydantic-ai>=2.0.0",
]
finetune = [
    "unsloth>=2026.4",
    "trl>=0.12.0",
    "wandb>=0.18.0",
]
# vnstock Gen 5 is not on PyPI (the PyPI project is quarantined with 0 files; OBSERVED 2026-10-22). It installs only from
# the vendor index through the hash-pinned lock requirements/vnstock/win-py313.lock (AGENTS.md "Build & Verification
# Commands"); `pip install ".[capture]"` from PyPI cannot resolve it. Never install vnai, vnstock 4.x or vnstock3.
capture = [
    "vnstock==5.1.0",
]
# Test and lint tools. No test imports hypothesis yet; ruff is pinned only (no ruff config and no lint gate yet).
dev = [
    "pytest==9.1.1",
    "hypothesis==6.170.5",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
