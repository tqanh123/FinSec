# coverage-floors.yaml — sàn độ phủ DÒNG theo TỪNG NHÓM (SSOT của cổng).
# Đọc bởi `scripts/coverage_gate.py`; ghim bởi
# `harness/tests/test_coverage_floor_gate.py`.
#
# ⚠️ VÌ SAO CHIA NHÓM CHỨ KHÔNG DÙNG MỘT SỐ CHUNG.
# Độ phủ là trung bình CÓ TRỌNG SỐ THEO SỐ DÒNG. Đo 2026-07-31 trên cây này:
# toàn `harness/` **88,1%** — nghe rất yên tâm — trong khi nhóm `*guard*`, tức
# đúng những đoạn mã có quyền TỪ CHỐI, chỉ **60,6%**. 23.561 dòng của
# `scripts/` kéo bảng lên và làm 1.388 dòng rủi ro nhất **vô hình**. Một cổng
# `fail_under = 85` sẽ XANH suốt qua chuyện đó.
#
# ⚠️ SÀN ĐANG LÀ "BÁNH CÓC", KHÔNG PHẢI MỤC TIÊU.
# Mỗi số dưới đây đặt ở ĐÚNG mức đo được, làm tròn xuống. Nó chặn TỤT LÙI, nó
# KHÔNG sửa hiện trạng. Nói thẳng: sàn 60 cho nhóm guard là **đóng băng một vấn
# đề**, không phải giải nó. Đặt cao hơn thì cổng ĐỎ ngay ngày dựng, và một cổng
# đỏ-lúc-sinh là cổng bị người ta tắt. Việc nâng dần ghi ở `DEBTS.md`/
# `BACKLOG.md`, không giấu trong tệp này.
#
# ⚠️ ĐIỀU KIỆN ĐO — SỐ KHÔNG KÈM ĐIỀU KIỆN THÌ KHÔNG SO ĐƯỢC VỚI SÀN Ở ĐÂY.
# Header này TRƯỚC ĐÂY chép tay một bảng phủ-từng-guard. Bảng đó vừa mục vừa sai
# nguồn: nó gọi tên `spawn_provenance_guard`, một tệp KHÔNG CÒN trên đĩa (đếm
# hôm nay: `harness/hooks/*guard*.py` ra 11 tệp, không có tên đó), và mọi con số
# trong nó đo bằng đường đo mù-tiến-trình-con. Nên ở đây không chép lại bảng nào
# nữa — chỉ ghi ĐIỀU KIỆN mà một con số phải sinh ra dưới đó thì mới đem so:
#
#   1. BẬT đo tiến-trình-con. Hook/guard chạy như tiến trình RIÊNG (dispatcher
#      exec chúng) và test cũng gọi y hệt; coverage mặc định chỉ theo tiến trình
#      cha, nên mọi dòng con chạy bị đếm là chưa phủ. Bật bằng
#      COVERAGE_PROCESS_START (job `coverage-floors` trong scripts/ci.sh) cộng
#      `parallel` trong [tool.coverage.run].
#   2. Danh sách `source` lấy từ [tool.coverage.run] trong pyproject.toml, KHÔNG
#      dùng `--cov=harness`. `harness/` không có `__init__.py`, coverage dừng
#      duyệt tại đó, chỉ tệp nào có test import mới vào báo cáo — tệp vắng mặt
#      là chưa phủ theo định nghĩa, nên mỗi lần vắng chỉ có thể ĐẨY phần trăm
#      LÊN.
#   3. Đọc số ra bằng `scripts/coverage_gate.py`, đừng tự quét lại.
#      Bộ quét chép lại là một kiểu hỏng đã gặp ở kho này; và ĐỪNG nối ống
#      (`| head`) khi xem kết quả cổng — ống nuốt mã thoát chặn, cổng trả 1 mà
#      đọc thành 0.
#
# Lần đo gần nhất dưới đủ ba điều kiện trên (toàn bộ suite, 11.556 xanh / 160
# bỏ qua / 0 đỏ), số lấy thẳng từ coverage_gate.py, census đủ tệp (0 tệp vắng):
#
#   nhóm      dòng    phủ      %       sàn
#   guards    1.279     950   74,28%    60
#   hooks     6.460   5.256   81,36%    70
#   scripts  27.463  23.315   84,90%    81
#   plugins  27.513  11.699   42,52%    42
#   install   1.273   1.123   88,22%    88
groups:
  guards:
    include: ["harness/hooks/*guard*.py"]
    floor: 60
    why: >-
      Nhóm mã có quyền TỪ CHỐI. Một dòng không ai chạy trong một cổng chặn là
      một cổng chưa ai chứng minh là chặn được. Đây là lý do cả tệp này tồn tại.
  hooks:
    include: ["harness/hooks/*.py"]
    floor: 70
    why: >-
      Hook chạy theo sự kiện, không ai gọi bằng tay, nên lỗi ở đây hỏng CÂM.
  scripts:
    include: ["harness/scripts/*.py", "harness/scripts/**/*.py", "harness/plugins/hs/skills/goal/scripts/*.py", "harness/plugins/hs/skills/cook/scripts/*.py", "harness/plugins/hs/skills/bakeoff/scripts/*.py", "scripts/*.py", "harness/plugins/hs/skills/compound/scripts/*.py", "harness/plugins/hs/skills/setup/scripts/*.py", "harness/hooks/*.py", "harness/plugins/hs/skills/scenario/scripts/*.py", "harness/plugins/hs/skills/partner/scripts/*.py", "harness/plugins/hs/skills/code-review/scripts/*.py", "release/*.py", "harness/plugins/hs/skills/release/scripts/*.py"]
    exclude: ["release/tests/*", "harness/scripts/rops/**", "harness/scripts/codegraph/**",
              "harness/scripts/port_*.py", "harness/scripts/codegraph_port_*.py",
              "harness/scripts/hs_run_port.py", "harness/scripts/coverage_floors.py", "harness/scripts/declared_checks.py", "harness/scripts/dirty_tree_guard.py", "harness/scripts/git_default_branch.py", "harness/scripts/harness_checks.py", "harness/scripts/policy_floor.py", "harness/scripts/static_checks.py", "harness/scripts/test_result_writers.py", "harness/scripts/test_runners.py"]
    floor: 81
    why: >-
      Động cơ dùng chung của các skill; một hồi quy ở đây lan ra mọi nơi gọi nó.
      Loại `harness/scripts/rops/**` và `harness/scripts/codegraph/**`: nhóm
      `port-rops` và `port-graph` đo riêng hai cây đó qua cặp glob của chính
      chúng — không loại thì mã port bị đếm ĐÔI vào cả hai nhóm và một lần tụt
      phủ chỉ ở mã port có thể đỏ sàn của nhóm dùng chung. Các module port
      PHẲNG (`port_*.py`, `codegraph_port_*.py`, `hs_run_port.py`) cũng loại
      vì nhóm `port-port` đo chúng. Chín module của check do harness chạy cũng
      loại vì nhóm `harness-checks` đo chúng.
  harness-checks:
    include: ["harness/scripts/coverage_floors.py", "harness/scripts/declared_checks.py", "harness/scripts/dirty_tree_guard.py", "harness/scripts/git_default_branch.py", "harness/scripts/harness_checks.py", "harness/scripts/policy_floor.py", "harness/scripts/static_checks.py", "harness/scripts/test_result_writers.py", "harness/scripts/test_runners.py"]
    floor: 92
    why: >-
      Check do harness tự chạy (runner, tsc/eslint, độ phủ theo nhóm) và sổ
      của chúng: cổng DoD và cook đọc các module này để đòi check theo tên, nên
      một hồi quy ở đây làm một check bị đòi trông như đã chứng minh. 92 là
      số đo thật (92,47%, 1154/1248 câu lệnh, đủ 9/9 tệp trên đĩa, lượt phủ
      toàn bộ `ci.sh coverage-floors` của cây ae666f128) làm tròn xuống.
  plugins:
    include: ["harness/plugins/**/*.py"]
    exclude: ["harness/plugins/hs/skills/_docslib/tests/*",
              "harness/plugins/hs/skills/docs-build/tests/*"]
    floor: 42
    why: >-
      Script skill, chạy theo yêu cầu. Phủ thấp nhất bảng và cũng ít nguy nhất —
      sàn đặt ở mức đang có để nó không tụt thêm. Sàn 58 cũ KHÔNG PHẢI bị hạ cho
      dễ: nó chưa bao giờ là số đo của nhóm này. Nó sinh ra từ báo cáo chạy bằng
      `--cov=harness`, mà `harness/` không có `__init__.py` nên coverage dừng
      duyệt tại đó và chỉ 116 trên 219 tệp của nhóm vào được báo cáo — hơn nửa
      nhóm vắng mặt, và tệp vắng mặt là chưa phủ theo định nghĩa, nên mỗi lần
      vắng chỉ ĐẨY phần trăm LÊN. Đo đủ tệp thì mẫu số đi từ 13.664 lên 27.513
      dòng trong khi số dòng được phủ gần như đứng yên. 42 là số đo thật của
      nhóm này (42,52%, làm tròn xuống); 58 là số đo của một nửa nhóm mang tên
      cả nhóm. `exclude` loại 12 tệp test của chính skill (`_docslib/tests/*`,
      `docs-build/tests/*`) — test không phải đối tượng của sàn, cùng nguyên
      tắc `scripts.exclude` đã áp cho `release/tests/*`; đo lại bằng
      coverage_gate.py trên báo cáo thật vẫn ra >42% sau khi loại, nên sàn 42
      giữ nguyên.
  install:
    include: ["harness/install/*.py"]
    floor: 88
    why: >-
      Đường cài đặt: hỏng ở đây thì người dùng mới không vào được, và họ không
      có cách nào tự chẩn.
  port-rops:
    include: ["harness/scripts/rops/*.py", "harness/scripts/rops/**/*.py"]
    floor: 74
    why: >-
      Động cơ thực thi từ xa port vào harness/scripts/rops/. Phủ đo riêng khỏi
      nhóm `scripts` cha: nhóm đó khai `exclude: ["harness/scripts/rops/**"]`
      nên không đếm đôi tệp rops vào trung bình chung — mã port giữ sàn của
      riêng mình. Đo lại 260926 ở f24694185a0707bf4b4ec3a5730a7bb967866563
      qua coverage_gate.files_in_group + một lượt coverage thật trên
      harness/tests/rops: 74,7% (1859/2489 câu lệnh, đủ 31/31 tệp trên đĩa —
      cây đã lớn từ 29 lên 31 tệp) làm tròn xuống.
  port-port:
    include: ["harness/scripts/port_*.py", "harness/scripts/codegraph_port_*.py",
              "harness/scripts/hs_run_port.py"]
    floor: 94
    why: >-
      Mã của tính năng port nằm ở module PHẲNG dưới harness/scripts/ (không
      thuộc gói codegraph, vì hs-run không được kéo codegraph vào). Khoá theo
      TÊN TỆP nên module port mới tự rơi vào nhóm. 94 là số đo thật (94,51%,
      8234/8712 câu lệnh, đủ 45/45 tệp trên đĩa, lượt phủ toàn bộ của cây
      6500a07e5) làm tròn xuống. Lượt đo trước (94,9%, 224/236, 3/3 tệp,
      cây 7de581768) có trước khi các verb port về cây này.
  port-check:
    include: ["harness/scripts/codegraph/check/*.py", "harness/scripts/codegraph/check/**/*.py"]
    floor: 92
    why: >-
      Các verb `hs-code check` (codegraph/check/). Đo riêng khỏi `port-graph`
      (nhóm đó loại `codegraph/check/**`). 92 là số đo thật (92,2%, 1848/2005
      câu lệnh, đủ 12/12 tệp trên đĩa, lượt phủ toàn bộ của cây 4527e2ece) làm
      tròn xuống. Lượt trước ở 1200 câu lệnh (91,5%, cây 66c22bda0); mẫu số tăng
      vì `f821 --resolve`, lượt đo giữa chừng 90,1% dưới sàn cũ nên thêm test. Sàn cũ 19 thấp giả vì test gọi `hs_code.py` trong tiến trình
      con với env dựng từ đầu làm rơi `COVERAGE_PROCESS_START`; env kín dùng
      chung đã sửa chỗ đó, lượt này là lượt đo đầu tiên sau bản sửa.
  port-graph:
    include: ["harness/scripts/codegraph/*.py", "harness/scripts/codegraph/**/*.py"]
    exclude: ["harness/scripts/codegraph/check/*.py", "harness/scripts/codegraph/check/**/*.py",
              "harness/scripts/codegraph/scaffold/*.py", "harness/scripts/codegraph/scaffold/**/*.py",
              "harness/scripts/codegraph/refactor/*.py", "harness/scripts/codegraph/refactor/**/*.py",
              "harness/scripts/codegraph/change/*.py", "harness/scripts/codegraph/change/**/*.py",
              "harness/scripts/codegraph/test/*.py", "harness/scripts/codegraph/test/**/*.py",
              "harness/scripts/codegraph/graph/*.py", "harness/scripts/codegraph/graph/**/*.py",
              "harness/scripts/codegraph/init/*.py", "harness/scripts/codegraph/init/**/*.py",
              "harness/scripts/codegraph/_core/lang/typescript/*.py",
              "harness/scripts/codegraph/_core/lang/typescript/**/*.py"]
    floor: 93
    why: >-
      Lõi thư viện đồ thị mã (`codegraph/__init__.py` + `codegraph/_core/`).
      Phủ đo riêng khỏi nhóm `scripts` cha (nhóm đó khai `exclude:
      ["harness/scripts/codegraph/**"]`). Mỗi gói con verb có nhóm riêng:
      `check/` → `port-check`, `scaffold/` → `port-scaffold`, `refactor/` →
      `port-refactor`, `change/` → `port-change`, `test/` → `port-test`,
      `graph/` → `port-graph-verbs`, `init/` → `port-init`; loại ở
      đây để `test_the_port_groups_claim_every_file_of_the_ported_graph_library_once`
      không thấy tệp bị hai nhóm cùng nhận. Gói con MỚI dưới codegraph/ phải có
      nhóm riêng và thêm vào exclude này cùng lượt. 93 là số đo thật (93,2%,
      4276/4588 câu lệnh, đủ 56/56 tệp trên đĩa, lượt phủ toàn bộ của cây
      4527e2ece) làm tròn xuống; gói `_core/adapter/` (sổ adapter + reader lệnh
      của dự án) nằm trong nhóm này, 92% (342/373).
  port-lang-typescript:
    include: ["harness/scripts/codegraph/_core/lang/typescript/*.py",
              "harness/scripts/codegraph/_core/lang/typescript/**/*.py"]
    floor: 92
    why: >-
      Gói TypeScript/JavaScript của bản đồ code (`codegraph/_core/lang/typescript/`:
      workspace, tsconfig, resolve_static, aliases, boundary, tests, symbol_uses,
      reader tree-sitter, engine compiler ghim). Tiền tố `port-` là quy ước nhóm cho
      MỌI gói con dưới codegraph/ (`test_the_port_groups_claim_every_file_of_the_ported_graph_library_once`);
      `port-graph` loại gói này cùng lượt. 92 là số đo thật (92,68%, 2419/2610 câu
      lệnh, đủ 18/18 tệp trên đĩa, lượt phủ toàn bộ `ci.sh coverage-floors` của cây
      ca70a75cf, số đọc bằng các hàm của `coverage_gate`) làm tròn xuống. Cùng lượt
      `port-graph` (đã loại gói này) đo 93,28% (5912/6338, 72/72 tệp): sàn 93 giữ.
  port-scaffold:
    include: ["harness/scripts/codegraph/scaffold/*.py", "harness/scripts/codegraph/scaffold/**/*.py"]
    floor: 82
    why: >-
      Các verb `hs-code scaffold` (`codegraph/scaffold/`: new-module,
      new-dist, slice-docs, agents-doc, codeowners). Đo riêng khỏi `port-graph`
      (nhóm đó thêm `scaffold/**` vào `exclude` CÙNG lượt này, cùng lý do
      `codegraph/check/**` đã loại cho `port-check` — không loại thì
      `test_the_port_groups_claim_every_file_of_the_ported_graph_library_once`
      thấy tệp bị hai nhóm cùng nhận; đây là hệ quả TRỰC TIẾP của việc thêm
      nhóm mới, không phải sửa số đo/why của `port-graph`, nên vẫn nằm trong
      phạm vi việc này chứ không đụng việc khác). 82 là số đo thật (82,2%, 485/590 câu lệnh, lượt phủ toàn bộ của cây 66c22bda0; lượt đầu 81,4%, 450/553,
      đủ 9/9 tệp trên đĩa, lượt phủ scoped trên các test
      `test_scaffold_*.py`/`test_hs_code_write_flag.py`/
      `test_hs_code_help_sweep.py` của cây b919b9db5 — không tệp nào khác
      trong bộ test import gói này, nên số bằng đo trên cả suite) làm tròn
      xuống.
  port-refactor:
    include: ["harness/scripts/codegraph/refactor/*.py", "harness/scripts/codegraph/refactor/**/*.py"]
    floor: 86
    why: >-
      Các verb `hs-code refactor` (`codegraph/refactor/`: move, rename,
      name-repair, slice, carve, owners hội tụ, báo đường dẫn cũ …). Đo riêng
      khỏi `port-graph` (nhóm đó loại `refactor/**`). 86 là số đo thật (86,14%,
      3979/4619 câu lệnh, đủ 26/26 tệp trên đĩa, lượt phủ toàn bộ
      `ci.sh coverage-floors` của cây f6bb38b10, số đọc bằng các hàm của
      `coverage_gate`) làm tròn xuống.
  port-change:
    include: ["harness/scripts/codegraph/change/*.py", "harness/scripts/codegraph/change/**/*.py"]
    floor: 95
    why: >-
      Các verb `hs-code change` (`codegraph/change/`). Đo riêng khỏi
      `port-graph` (nhóm đó loại `change/**`). 95 là số đo thật (95,75%,
      1082/1130 câu lệnh, đủ 9/9 tệp trên đĩa, lượt phủ toàn bộ
      `ci.sh coverage-floors` của cây 71d10a8e1) làm tròn xuống. Lượt trước
      95,9% (821/856, 7 tệp, cây 66c22bda0); mẫu số tăng vì `verbs.py`
      (impact + test select) dời vào gói, lượt đo giữa chừng 93,7% dưới sàn
      nên thêm test các lệnh từ chối, không hạ sàn.
  port-test:
    include: ["harness/scripts/codegraph/test/*.py", "harness/scripts/codegraph/test/**/*.py"]
    floor: 90
    why: >-
      Các verb `hs-code test` (`codegraph/test/`). Đo riêng khỏi
      `port-graph` (nhóm đó loại `test/**`). 90 là số đo thật sau khi đủ 22
      tệp của pha vào cây (90,02%, 2373/2636 câu lệnh, đủ 22/22 tệp trên
      đĩa, lượt phủ toàn bộ của cây 1853242c7) làm tròn xuống.
  port-graph-verbs:
    include: ["harness/scripts/codegraph/graph/*.py", "harness/scripts/codegraph/graph/**/*.py"]
    floor: 86
    why: >-
      Các verb `hs-code graph` (`codegraph/graph/`: snapshot, truy vấn, luật).
      Đo riêng khỏi `port-graph` (nhóm đó loại `graph/**`). 86 là số đo thật
      (86,8%, 486/560 câu lệnh, đủ 4/4 tệp trên đĩa, lượt phủ toàn bộ
      `ci.sh coverage-floors` của cây 56946021d, lượt đầu tiên sau khi 4 module
      phẳng dời vào gói) làm tròn xuống.
  port-init:
    include: ["harness/scripts/codegraph/init/*.py", "harness/scripts/codegraph/init/**/*.py"]
    floor: 85
    why: >-
      Domain `hs-code init` (`codegraph/init/`: status/run/decline + các hàm
      initializer graph/port). Mã viết mới ở cây này, không port — tiền tố
      `port-` là quy ước nhóm cho MỌI gói con dưới codegraph/ (cổng
      `test_the_port_groups_claim_every_file_of_the_ported_graph_library_once`),
      dòng STANDARDIZE của nó khai `NEW`/`[thiết kế mới]`. Đo riêng khỏi
      `port-graph` (nhóm đó loại `init/**` cùng lượt). 85 là số đo thật
      (85,21%, 144/169 câu lệnh, đủ 2/2 tệp trên đĩa, lượt phủ SCOPED trên 6
      tệp test gọi tới init — `test_hs_code_init.py`,
      `test_hs_run_facts_end_to_end.py`, `test_hs_run_facts_engine.py`,
      `test_scout_asks_the_graph_for_multi_step_imports.py`,
      `test_hs_code_help_sweep.py`, `test_hs_code_write_flag.py` — với
      COVERAGE_PROCESS_START bật, 313 xanh) làm tròn xuống; đo scoped chỉ có
      thể THẤP hơn đo toàn suite.
  port-packs:
    include: ["packs/**/*.py"]
    exclude: ["packs/*/tests/**"]
    floor: 91
    why: >-
      Mã pack ngoài phần phát hành (`packs/opsbrain/`: 3 cổng, shape
      `two_backs`, bộ chạy cổng). Đo riêng vì `packs/` không nằm dưới
      `harness/` và không thuộc nhóm nào ở trên. 91 là số đo thật (91,6%,
      460/502 câu lệnh, đủ 5/5 tệp trên đĩa, lượt phủ toàn bộ của cây
      ed0ca302b, đo trên homelab qua `hs-rops run` vì job ~217s trên cả
      suite) làm tròn xuống.
