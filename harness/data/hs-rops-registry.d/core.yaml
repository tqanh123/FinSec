# core.yaml — the commands hs-rops ships. One row per command:
#   <name>: {module: rops.verbs.<file>, help: "<one line>"}
# The module itself is the command (`add_args(p)` + `run(ns)`). A repo adds its own in
# `.claude/rops/verbs/*.py`, and `ROPS_CMD_<NAME>` in `.rops.env` adds an alias; a name
# two of those declare is an error naming both.

domains:
  sync: {module: rops.verbs.sync, help: "rsync the tree to the remote (--back pulls)"}
  lane: {module: rops.verbs.lane, help: "real git worktree of this tree on the remote (bare + push + rsync)"}
  run: {module: rops.verbs.run, help: "run one command remotely"}
  fetch: {module: rops.verbs.fetch, help: "pull a remote file or directory back"}
  ci: {module: rops.verbs.ci, help: "run a GitLab pipeline remotely (capability-gated)"}
  gitlab: {module: rops.verbs.gitlab, help: "real GitLab + runner on the remote (the heavy lane)"}
  bench: {module: rops.verbs.bench, help: "repeated timing on a quiet machine, spread reported"}
  kill: {module: rops.verbs.kill, help: "kill a remote process group: a number is a PGID, anything else a pgrep -f pattern"}
  doctor: {module: rops.verbs.doctor, help: "show resolved config + check the remote"}
