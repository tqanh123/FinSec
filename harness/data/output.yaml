# output.yaml — language + code style of harness-GENERATED output.
#
# Instruction files (skills, references, rules, CLAUDE.md) are English. These
# settings govern what the harness WRITES OUT.
#
#   language: vi | en   (default vi — English instructions in, Vietnamese reports out)
#   thinking_language: en (default) — the language the model THINKS/reasons in (extended
#     reasoning), separate from `language` (the prose written OUT). A free language
#     code/name. Co-located with `language` because both are locale axes.
#   code_style: off (default) or 0..5 — adapts GENERATED CODE only (comment density,
#     verbosity, examples) to the reader's coding expertise. 0=beginner (eli5) …
#     5=expert (god). It shapes the deliverable; it never touches evidence or a gate
#     decision. Profiles: harness/data/output-styles/.
#     Off = leave the key absent. Set via `output_config.py --set code_style=N` or /hs:setup.
#
# There used to be a second config file for a terminal conversational voice, plus
# `audience` and `humanize` here. All of it shaped how the assistant TALKED rather
# than what it produced, and was paid for on every session start and every subagent
# spawn. One-command view of every knob: `output_config.py --resolved`.

language: vi
code_style: 3
thinking_language: en

# visual — what the DELIVERABLE looks like. Beside `code_style` because it answers the
# same question it does; a second config door for one question is how two doors start
# giving different answers. Booleans only: a quoted "false" reads as ON everywhere in
# Python, so it is refused rather than coerced, and an unknown switch is an error rather
# than a no-op (a typo'd switch reads as configured).
#
#   editorial       — decorative panels at all. Off = plain structural output.
#   diagram_design  — the vendored diagram drawer (harness/assets/diagram-templates/,
#                     24 types x light/dark/full, self-contained).
#   antv            — the vendored infographic bundle (harness/assets/antv/, 874 KB).
#                     OFF by default: 874 KB lands on pages that use none of it, and it
#                     earns its size only from about three panels up.
# Per-invocation kill switches --no-editorial-visuals / --no-diagram-design / --no-antv
# override these downward for one run; they never turn something on that is off here.
visual:
  editorial: true
  diagram_design: true
  antv: false
