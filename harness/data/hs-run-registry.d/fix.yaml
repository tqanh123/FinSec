# fix.yaml — the `fix` domain's fragment of the hs-run registry.
#
# Owned exclusively by whoever builds the `fix` domain's verbs. Never touch
# another domain's fragment from here — one file per domain is what lets domains
# be built concurrently without two agents writing the same file. Schema +
# merge/conflict rules: see harness/data/hs-run-registry.yaml's header.

domains:
  fix:
    next: {module: hs_run_fix, entry: NEXT, help: "report where a fix stands and which lifecycle step is next"}

# Four of the six steps `hs:fix` walks leave nothing a program can read: the two
# report steps write into a SHARED directory under a model-picked slug, the code
# change is a dirty tree that carries no actor, and a suite result is not a disk
# fact at all. States for those would be assertions dressed as readings, so the
# four are absent by decision — the gate in test_hs_run_fix_domain.py enforces
# that a later edit cannot quietly add one back.
step_routing:
  fix:
    skill: fix
    covers_skill: true

    # Both rules apply at EVERY state, which is what `always:` is for rather than
    # a copy in each of the four. Every answer here is read against evidence the
    # tree carries (`verification-mechanism`), and every fix is a change someone
    # else's code has to keep calling (`no-orphan-code`). Exactly two, the cap: a
    # third would have to displace one of these.
    always:
      rules: [verification-mechanism, agent-operational-discipline]

    states:
      # ── repeating has stopped being an attempt ────────────────────────────
      # Raised by the ENGINE, not by this domain: the same answer has come back
      # often enough that another identical run is not new evidence. The domain's
      # own answer rides as `domain_state` — counsel about the wrong problem is
      # worse than none, so the finding has to stay readable.
      stuck:
        summary: >-
          This domain has answered the same thing enough times in a row that repeating
          it is no longer an attempt. Stop re-running and spawn `hs:escalation-consultant`
          for counsel — hand it the task, the evidence as file:line, what was already
          tried, and the specific question. It advises; the decision stays here.
        rules: [orchestration-protocol, agent-operational-discipline]
      # The fork, and the state this domain exists to get right. Every sibling
      # assumes a plan; `fix` is the one that legitimately may not have one, and
      # in that tree neither later gate can be read at all. Rung 2 rather than 10:
      # the gate's precondition is absent, and no amount of model reasoning
      # produces one.
      no_plan_resolved:
        summary: >-
          No plan resolved, so the push-stage gate cannot clear and a verification
          has nowhere to be written. Build and commit the fix if you like — just
          do not expect the stage gate to pass until a plan exists.
        rules: [no-orphan-code]
        refs: [references/triage-and-scope.md, references/minimal-fix-discipline.md]

      # Read through the SAME call `cook close` makes, so a fix and a cooked phase
      # clear one gate rather than two that agree by coincidence.
      needs_review:
        summary: >-
          No PASS review-decision is recorded for this plan and its measured diff
          did not earn a waiver (over a size threshold, risk tier above tiny, or
          the work could not be sized). Spawn the reviewer and record the verdict
          — reviewing your own fix is what this gate prevents.
        # `auto-decision-ledger` was routed here and came out: it governs recording
        # what an autonomous mode decided ON ITS OWN, which is a different question
        # from "has anyone reviewed this yet". With the two `always:` rules this row
        # was handing over 6 documents against a budget of 5, and the reader who
        # opens 6 drawers at a gate about spawning a reviewer reads none of them.
        rules: [workflow-handoffs]
        refs: [references/verify-and-gate.md, references/regression-test.md]
        # `code.importers`/`code.tests_reached`: reverse-deps + tests touched
        # by the fix's OWN changed files (default subjects: the diff-vs-
        # merge-base + dirty-file scope cook/review already read through) —
        # this is exactly the "blast-radius sweep" `fix/SKILL.md:48-60`
        # already instructs by hand before writing verification.json; the
        # data now rides here instead of staying pure prose.
        # `code.stale_mentions`: a fix that renames or removes a name leaves its
        # docstring/doc/config mentions behind; the review reads the same fact.
        facts: [code.importers, code.tests_reached, code.stale_mentions]

      # Engine-generated (`hs_run_facts.engine._offer_outcome`, kept or dropped by
      # `hs_run._apply_facts`): a state here declares `facts:`, the repo has no code
      # map, someone is at the terminal and nobody has answered this session. The
      # block is the same in every facts domain (test_every_facts_domain_declares_
      # the_same_offer_block); the step's own answer rides in `deferred`.
      codemap_offer:
        summary: >-
          This step reads code facts and the repo has no code map yet. Ask the user
          once; either answer ends the offer for this session, then run the step
          again and take its real answer (it is kept in `deferred`).
        ask_user:
          question: Set up the code map for this repo now?
          facts:
            - this step reads code facts (which tests reach a change, who imports it) from the code map
            - the repo has no codemap.yaml yet, and nothing was decided for it this session
          options:
            - set it up — hs-code init run --apply (writes codemap.yaml and a first snapshot)
            - not now — hs-code init decline (not asked again this session)
      # Engine-generated (`hs_run_facts.engine._stale_outcome`), never
      # returned by this domain's own verbs — required because
      # `needs_review` declares `facts:` (a domain declaring facts on some
      # state must route `facts_stale` itself, same law `cook.yaml`'s own
      # `facts_stale` row already follows).
      facts_stale:
        summary: >-
          The code-graph snapshot backing this fix's `code.importers`/`code.
          tests_reached` facts is missing or older than HEAD within its own
          roots — run the named refresh command, then retry. The review-gate
          question itself is unchanged underneath; only the fact could not
          answer.

      # The review passed and the stage gate still refuses: the blocker is in the
      # evidence the gate reads, and its own reason names which.
      gate_blocked:
        summary: >-
          The review passed but the push-stage gate refuses. The reason names the
          missing or malformed receipt; fix that rather than re-running the review.
        refs: [references/verify-and-gate.md]

      # Rung 10, never 0. Everything disk-provable is satisfied and the question
      # that remains — root cause or symptom — is not disk-provable, which is
      # exactly the boundary the golden standard names out loud rather than
      # quietly reporting past.
      ready:
        summary: >-
          Review PASSED and the stage gate clears. Whether the ROOT CAUSE is fixed
          rather than a symptom patched is not readable from disk — confirm that
          before shipping.
        rules: [tdd-discipline]
        refs: [references/verify-and-gate.md]
        ask_user:
          question: Is the root cause fixed, not just a symptom?
          facts:
            - review PASSED and the stage gate cleared
            - whether the change addresses the root cause is not readable from disk
          options:
            - confirm — ship it
            - reject — keep investigating the root cause
