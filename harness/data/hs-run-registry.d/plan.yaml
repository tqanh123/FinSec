# plan.yaml — the `plan` domain's fragment of the hs-run registry.
#
# Owned exclusively by whoever builds the `plan` domain's verbs. Never touch
# cook.yaml or any other domain's fragment from here — one file per domain is what
# lets the `plan` and `cook` build phases run concurrently without two agents writing the same file.
# Schema + merge/conflict rules: see harness/data/hs-run-registry.yaml's header.

domains:
  plan:
    next:     {module: hs_run_plan, entry: NEXT, help: "report the next planning step from disk artifacts"}
    scaffold: {module: hs_run_plan, entry: SCAFFOLD, help: "create a new plan skeleton (plan.md + one phases/phase-N-<name>.md per --phases name)"}
    graph:    {module: hs_run_plan, entry: GRAPH, help: "check plan-graph.yaml for cycles, hazards, and conflicts"}
    prompt:   {module: hs_run_plan, entry: PROMPT, help: "report which subagent role to spawn next (never spawns it)"}
    record:   {module: hs_run_plan, entry: RECORD, help: "ingest a completed subagent's output and re-project the next step"}

# What each STEP needs — read by the dispatcher, emitted as the envelope's `rules`,
# `references` and `advisory`. This is the table that used to be twelve rule pointers
# plus a paragraph per state in plan/SKILL.md, where nothing could check them.
#
# Keyed by STATE, and that is the whole design. A skill body is read ONCE when the skill
# loads; by the time a run reaches `needs_redteam` the paragraph naming the red-team
# reference is thousands of tokens back. Loaded is not followed. Here the pointer arrives
# at the moment the step begins.
#
# `refs:` are PATHS relative to the skill dir, never text. The envelope carrying 14 kB of
# reference prose would be a second copy of a file that already exists, and a second copy
# drifts with nothing to notice.
#
# `when_flag:` because not every condition is a state. The four grid references are
# worthless on a run without `--grid`; hanging them on the state unconditionally loads
# four files on every plan ever made.
#
# `advisory:` for guidance the CLI cannot make a state out of, because it cannot DETECT
# it from disk. "A decision was just finalized" is a model judgment; a state keyed on it
# would never fire while every gate stayed green.
#
# Two refs were held out of this table on the argument that their trigger is a model
# judgment ("worth building deliberately", "scope over one plan") and that routing would
# "load them always". Re-examined and REVERSED, because both halves were wrong.
# Delivering a pointer is not making the judgment — `red-team-gate.md` is routed at
# `needs_redteam` without the CLI deciding to red-team. And `refs:` are PATHS: routing
# one costs ~40 characters at ONE state, not the file, and not on every run. Against
# that, a prose pointer sits thousands of tokens behind the step that needs it, which is
# the failure this table exists for. `five-hat-elaboration.md` now rides `needs_planner`
# (the state where the material is generated, before red-team) and
# `grid-when.md` also rides `scaffolded` unconditionally (the one pre-flag state a
# plan reaches without declaring `--grid`).
#
# Caps (gated): 4 rules and 4 `refs:` per state, 2 in `always`, 400 chars of advisory.
# Those count ONE key each. The budget that counts what a step actually hands over —
# `refs:` + `docs:` + every `when_flag:` block that can apply — is 5 documents, with
# named per-state exemptions, and lives in
# `test_a_step_hands_over_no_more_reading_than_its_budget.py`. Adding a `docs:` entry
# or a conditional ref spends that budget exactly like a `refs:` entry does.
step_routing:
  plan:
    skill: plan
    covers_skill: true
    # The home rule for probe-before-you-build. It governs how every step of a plan is
    # worked, not one of them, which is the only thing that belongs here.
    always:
      rules: [agent-operational-discipline]
    states:
      no_plan:
        summary: >-
          No plan directory exists yet — the run starts by scaffolding one. Do the
          understand interview FIRST; the 5-fact floor is invariant. If a discovery
          brief already exists, scaffold INTO its folder by passing that dir's
          `--id`/`--slug` — scaffolding beside it orphans the brief in a sibling
          folder with nothing to notice.
        # The read-these-standards instruction, which had no mechanism until now. The
        # three hooks naming these files are NUDGES for the MISSING case — fed a tree
        # where they are present, setup_nudge and nudge_context_inject both emit
        # {"continue": true}. LESSONS.md has no hook at all.
        docs: [docs/system-architecture.md, docs/code-standards.md, harness/LESSONS.md]
      scaffolded:
        summary: >-
          `plan scaffold` just wrote the directory. Reported by the scaffold verb
          itself, carrying the projection's own next step.
        # `grid-when.md` routed HERE, not only behind `--grid`. It owns the four
        # preconditions and the flat cost floor — the criteria for DECIDING the
        # flag — and its only other two routes are `when_flag: grid:` and
        # `grid_needs_axes`, both of which require the flag to already be set.
        # SKILL.md tells the reader not to decide from the body and to wait for
        # the run to route the file; behind the flag alone, that instruction
        # resolves to nothing. `scaffolded` fires exactly once, right after the
        # scaffold verb, before anything downstream could have declared `--grid`
        # — the one pre-flag state a plan reaches without it.
        refs:  [references/tdd-plan-mode.md, references/grid-when.md]
      needs_research:
        summary: >-
          The plan body still carries TBD placeholders. Spawn `@researcher`, then
          `record researcher --out <file>`. `--fast` declares the skip.
        # research is where a measured number first enters the plan, and a rate
        # without its counts is where it stops being checkable.
        #
        # `counting-discipline` sits beside it rather than replacing it: the two
        # answer different questions about the same number. sampled-rate governs
        # the INTERVAL around a rate; counting-discipline governs whether the
        # count underneath is sound at all — where the denominator came from,
        # what was excluded, whether the measurement ran. A census needs no
        # interval and still needs every one of those.
        #
        # It takes `architectural-constraints`' slot, and that is a real trade
        # rather than a free addition — the 4-rule cap is what stops this table
        # becoming a dump. The displaced rule opens with "load during hs:plan's
        # constraint-scan step", which is `needs_planner`, where it is still
        # routed. Here it was arriving a step early; the number arrives HERE.
        rules: [counting-discipline, sampled-rate-reporting]
        refs:  [references/research-phase.md]
      needs_planner:
        summary: >-
          Content is there but `plan-graph.yaml` is missing or invalid. This is the
          design step: decompose into phases, then write it — at main on a fast plan
          (the light lane stays inline); the `@planner` delegation is the `--hard`
          lane's, and a hard plan records it.
        # adr-trigger's own first line says "load during hs:plan when a plan touches
        # architecture" — the design step is where that is decided, and it was reachable
        # from no skill body at all until this line existed.
        rules: [architectural-constraints]
        # At the 4-ref cap. five-hat rides here because the material it shapes is
        # generated at the design step, before red-team — not at `needs_redteam`, which
        # is already too late for it.
        refs:  [references/phase-decomposition.md, references/constraint-scan.md, references/solution-design.md, references/five-hat-elaboration.md]
        # Named again at the design step on purpose: this is where the plan either
        # follows the shared architecture or quietly invents its own, and by now the
        # `no_plan` envelope that first named them is far behind in the transcript.
        docs:  [docs/system-architecture.md, docs/code-standards.md]
        when_flag:
          # `grid-when.md` again, and deliberately the same file rather than a second
          # one. It is routed at `scaffolded` for the reader still DECIDING
          # the flag; here the flag is set, and the re-hand costs one path in a list
          # that already resolves to a file the reader may have read. Routing a
          # different grid document here instead would put build instructions at the
          # design step, which `test_grid_when_guidance.py` refuses.
          grid:
            refs: [references/grid-when.md]
          # The design step IS where a `--tdd` plan earns its per-phase red→green
          # pairs, and where cook later reads them. Routed at `scaffolded` alone
          # this arrived a beat early, and only ever on the path that goes through
          # the scaffold verb — nothing else emits that state.
          tdd:
            refs: [references/tdd-plan-mode.md]
        # `code.callers`: caller (file:line, best-effort) for a symbol the
        # planner names EXPLICITLY via `--fact-subjects` while self-
        # verifying a claim (the Contract Verifier role in `plan/
        # references/verification-roles.md` — this replaces its hand-run
        # `grep -rn "<function_name>" .`). No `--fact-subjects` given ->
        # `hs_run_facts.engine._requires_explicit_subjects` answers
        # `unavailable` without touching the snapshot at all; `next` stays
        # at `needs_planner`, never `facts_stale`, for a fact nobody asked.
        facts: [code.callers, code.mentions]
      # Engine-generated (`hs_run_facts.engine._offer_outcome`, kept or dropped by
      # `hs_run._apply_facts`): a state here declares `facts:`, the repo has no code
      # map, someone is at the terminal and nobody has answered this session. The
      # block is the same in every facts domain (test_every_facts_domain_declares_
      # the_same_offer_block); the step's own answer rides in `deferred`.
      codemap_offer:
        summary: >-
          This step reads code facts and the repo has no code map yet. Ask the user
          once; either answer ends the offer for this session, then run the step
          again and take its real answer (it is kept in `deferred`).
        ask_user:
          question: Set up the code map for this repo now?
          facts:
            - this step reads code facts (which tests reach a change, who imports it) from the code map
            - the repo has no codemap.yaml yet, and nothing was decided for it this session
          options:
            - set it up — hs-code init run --apply (writes codemap.yaml and a first snapshot)
            - not now — hs-code init decline (not asked again this session)
      # Engine-generated (`hs_run_facts.engine._stale_outcome`), never
      # returned by this domain's own verbs — required because
      # `needs_planner` declares `facts:` (a domain declaring facts on some
      # state must route `facts_stale` itself, same law `cook.yaml`'s own
      # `facts_stale` row already follows). Only reachable when
      # `--fact-subjects` WAS given (an unnamed-subjects call never
      # selects a snapshot, so it can never go stale) and that snapshot is
      # missing/stale for the current tree.
      facts_stale:
        summary: >-
          The code-graph snapshot backing this `--fact-subjects` call's
          `code.callers` fact is missing or older than HEAD within its own
          roots — run the named refresh command, then retry. The design
          step itself is unchanged underneath; only the fact could not
          answer.
      # The grid leg. These are PEER states, not sub-states of needs_planner: one
      # name, one routing row, one exit code per call. Nesting them would put "which
      # level am I on" back in the model's head, which is the thing this table exists
      # to remove.
      #
      # Before this, `--grid` routed four references at ONE state — ~27k characters
      # arriving together, with the step ORDER left in prose. Each state below now
      # carries only the reference its own step needs.
      grid_needs_axes:
        summary: >-
          `--grid` is on and no axis receipt exists. Spawn `@grid-axis-selector`; it
          reads THIS plan's prose and writes the receipt. The step exists because a
          grid built on canned axis values lands mostly-N/A.
        # The axis decision is made here, and getting it wrong is the failure mode
        # that ships a grid whose values do not exist in the project.
        refs: [references/grid-when.md]
        advisory: >-
          Do not build from the canned axis defaults. The selector reads THIS plan's
          prose; a grid built on invented axis values lands mostly-N/A, which is a
          coverage number that means nothing.
      grid_needs_fill:
        summary: >-
          Axis receipt present, no fill source. Spawn `@grid-filler`; it writes cell
          content to a JSON file rather than editing the grid.
        refs: [references/grid-preregistration.md]
        advisory: >-
          A cell the filler cannot ground stays an honest STUB with a reason. An
          all-degradation grid is not a completed grid.
      # The three deterministic rungs. Each prints ONE verbatim-runnable command
      # against pinned paths, which is the promise exit 11 makes — they are the
      # plan domain's first real tier-11 states.
      grid_needs_build:
        summary: >-
          Fill source present, no skeleton grid. Deterministic: run the one command
          the envelope prints.
        refs: [references/grid-coverage-step.md]
      grid_needs_expand:
        summary: >-
          Skeleton built. Validate the fill source, then relay it through the
          expander — the validation is what keeps unground cells honest stubs.
        refs: [references/grid-coverage-step.md]
        advisory: >-
          Validate the fill source before relaying it. An unresolved source relays no
          cells and every cell degrades silently, which looks like an honest grid.
      grid_needs_emit:
        summary: >-
          Grid filled, no coverage-grid artifact yet. Deterministic: run the one
          command the envelope prints.
        refs: [references/grid-coverage-step.md]
      grid_unresolved:
        summary: >-
          The coverage-grid exists but no cell carries real content. Either ground
          the cells or write the thin-grid attestation INTO the artifact.
        refs: [references/grid-mode.md]
        advisory: >-
          Write the [JUSTIFIED-THIN] attestation INTO the artifact. A justification
          that lives only in chat earns zero credit at either gate.
      # Two states the CLI has always emitted with nothing routed to them. Both
      # are ordinary steps, not errors, and both were reachable only from a
      # skill body that had already scrolled away by the time they fired.
      multiple_plans:
        summary: >-
          More than one plan directory resolves. Ambiguity, not failure — name the
          target with `--plan <dir>` rather than guessing.
      waiting_on_model:
        summary: >-
          `plan prompt <role>` just handed out a subagent prompt. Spawn the agent,
          then feed its output back with `plan record <role> --out <file>`.
        # `plan prompt` just handed out a subagent prompt. What governs next is
        # the spawn-and-consume contract, and the failure it prevents is the
        # advisory subagent that edits the plan instead of reporting on it.
        rules: [orchestration-protocol, agent-operational-discipline]
      needs_redteam:
        summary: >-
          Content and plan-graph are on disk, no red-team report is. Run the Goodhart
          check and the 6-lens pre-mortem yourself first — those findings feed the
          `risks:` frontmatter at C/H/M/L — then spawn `@red-teamer` (an inline
          persona pass is the fallback only when spawning is genuinely unavailable).
          After applying findings, sweep the
          plan for consistency: a finding applied in one phase and not the others
          leaves the plan disagreeing with itself. `--fast` declares the skip.
        # the step most likely to produce "I measured X% and therefore Y" — and the one
        # where a threshold straddled by its own interval turns into a verdict.
        rules: [verification-mechanism, sampled-rate-reporting]
        refs:  [references/red-team-gate.md]
        # How far each file the plan will modify or delete reaches, for the round that
        # attacks it (subjects: `hs_run_plan._redteam_fact_subjects`). Advisory: a
        # stale or missing code map is said on the facts and never holds the round.
        facts: [code.fan_in, code.importers]
        facts_advisory: true
      needs_redteam_disposition:
        summary: >-
          A red-team report concludes `verdict: REVISE` and plan.md's `## Red-team
          disposition` table is missing, empty, or has an empty cell. Dispose of
          every finding (Accept: the phase that now carries it / Reject: the
          evidence), propagate each Accept into its phase, then run `next` again.
        rules: [verification-mechanism]
        refs:  [references/red-team-gate.md]
      needs_model_attestation:
        summary: >-
          Everything disk-provable is proven. What remains is not: the red-team
          disposition, the validate interview, the consistency sweep. Do them for
          real, then run the approval command the envelope prints.
        refs:  [references/validate-gate.md, references/verification-roles.md]
        advisory: >-
          An architecture decision finalized here is recorded, not remembered: run
          decision_register.py --append-alloc. The register is what stops an old
          tension being re-litigated from scratch next time it surfaces.
        # `plan_approval.py --verdict APPROVED|REJECTED --rationale "<why>"` (named
        # in `next_action` above) stays the confirm flow for the ATTESTATION
        # decision itself — this block is the DEDICATED design the old
        # `ask_user_exempt` comment deferred to: the plan's own size
        # dashboard (`plan_facts.describe` — facts only, no split
        # recommendation) is a QUESTION with no command-driven flow of its
        # own, so it rides the shared block instead. `facts:` below carries
        # this one static line the schema requires on every declared block;
        # the per-plan numbers are APPENDED at runtime by `hs_run_plan.
        # _size_facts_for_ask_user` (`hs_run._apply_ask_user_dynamic_facts`),
        # never invented here.
        ask_user:
          question: >-
            Keep this plan as one, or split it into sub-plans?
          facts:
            - "hs-run makes no split recommendation — these are this plan's own size facts, not a verdict"
          options:
            - "keep — one plan"
            - "split — write sub-plans, record which"
      approval_invalid:
        summary: >-
          An approval artifact exists but does not back THIS plan — wrong plan, or
          no longer valid. Re-review which verdict is now correct; never re-stamp.
        ask_user_exempt: >-
          same approval-decision flow as needs_model_attestation — re-review, then
          re-run plan_approval.py; a generic block would duplicate that command
      approval_drifted:
        summary: >-
          The plan WAS validly approved, then the body changed. A stale approval,
          not a conflicting story: re-review the part that drifted.
        ask_user_exempt: >-
          same approval-decision flow as needs_model_attestation — re-review, then
          re-run plan_approval.py; a generic block would duplicate that command
      rejected:
        summary: >-
          Terminal. The review rejected this plan — revise the body and phases
          against the recorded reason before asking again.
      approved:
        summary: >-
          Terminal for the plan domain. Hand off to cook using the flags the plan
          was built with — `--grid` carries via frontmatter, no retyping.
        # workflow-handoffs is routed HERE, not one state later. `approved` is where
        # the cook command is composed — its own next_action IS that command, built
        # by `_cook_recommendation` from the plan's frontmatter. Routed only at
        # `handed_off_to_cook`, the carry rules arrived after the carry had happened,
        # which is why the skill body kept a private copy of them.
        rules: [workflow-handoffs]
        # The `--parallel` dual-recommendation phrasing, needed at the moment the
        # command is written rather than after it has been run.
        refs:  [references/cook-handoff-flags.md]
      split:
        summary: >-
          Terminal for this plan. The human chose to split it: it holds no phase and is
          never cooked; each child plan naming it as `parent_plan` is reviewed, approved
          and cooked on its own.
        refs:  [references/plan-split.md]
      split_pending:
        summary: >-
          The human chose to split this plan, and the split is not finished: no child
          plan names it as `parent_plan` yet, or it still holds phase files a child
          should own. It is never cooked itself.
        ask_user_exempt: >-
          the human already answered keep/split at the approval step; what is left is
          writing the child plans and moving phase files, which next_action names — a
          generic block would ask a question nobody owes
        refs:  [references/plan-split.md]
      # The handoff, and the reason a pointer can belong to a state rather than a skill:
      # what cook must honour is what plan needs to say here, once.
      handed_off_to_cook:
        summary: >-
          The plan is in_progress and cook owns it now. Nothing left in the plan
          domain — continue with `hs-run cook next`.
        # workflow-handoffs IS a handoff table — who receives what, what is handed
        # over, where to stop — and this state IS the handoff. It was reachable only
        # from seven skill bodies, none of which is being read at the moment the
        # handover happens.
        rules: [tdd-discipline, workflow-handoffs]
        refs:  [references/cook-handoff-flags.md]
      completed:
        summary: >-
          Terminal. The whole chain finished; what is left is archiving the plan
          directory.
        refs:  [references/archive-workflow.md]
      # The four states the CLI emits with no routing, and correctly so: each is fully
      # served by `next_action` and needs no extra file. They carry a summary anyway,
      # because a reader meets them exactly as often as the routed ones — and sourcing
      # the map from `states` alone would have silently dropped all four.
      unresolved:
        summary: >-
          A directory that is not a finished plan — `plan.md` missing, or present with
          no `phases/` dir at all. Half-scaffolded plan to finish, or stray dir to remove.
          An empty `phases/` on an unadvanced plan is mid-authoring and stays at
          `needs_planner` instead.
      # The same reading, reported by the verb that was asked to ACT on that
      # directory rather than to survey it: rung 2, because a named target that is
      # not a plan is a broken invocation, not a survey result.
      not_a_plan_dir:
        summary: >-
          The directory named on the command line is not a plan. Nothing was read or
          written; check the path before re-running.
      state_conflict:
        summary: >-
          Frontmatter and the artifacts on disk tell different stories. STOP: find out
          which side is lying. Never pick one and carry on.
      cancelled:
        summary: >-
          The plan was deliberately cancelled. Nothing for this domain to do, by
          design, until a human un-cancels it — a leftover approval does not revive it.
      error:
        summary: >-
          The invocation itself was wrong — missing flag, unknown role, unresolvable
          plan. Nothing was read or written; fix the command and re-run.
      # `plan graph`'s own four states. It is a QUERY verb — asked on purpose, about
      # a file the asker already has in mind — so the answer belongs in the reply,
      # not in a reference the caller must go read. The refs stay at `needs_planner`,
      # which is the state that fires when the same missing sidecar blocks the RUN;
      # duplicating them here would hand a diagnostic 4 files to answer a yes/no.
      absent:
        summary: >-
          Queried by `plan graph`: no `plan-graph.yaml` at all. Not a fault on its own
          — a plan reaches this shape before the design step writes one. Where the run
          is actually blocked by it, `needs_planner` fires and carries the pointers.
        refs: [references/plan-graph-format.md]
      malformed:
        summary: >-
          Queried by `plan graph`: the sidecar is there and does not parse. Distinct
          from `absent` on purpose — that difference is read off the filesystem, never
          from the parser's wording, so this state survives a reworded error.
        refs: [references/plan-graph-format.md]
      invalid:
        summary: >-
          Queried by `plan graph`: the sidecar parses, and node(s) declare no `post`.
          The names are listed in the reply; nothing downstream can order a node that
          never says what it unblocks.
        refs: [references/plan-graph-format.md]
      ok:
        summary: >-
          Queried by `plan graph`: the sidecar parses and every node declares its
          `post`. Cycles, ordering hazards and parallel conflicts ride back as
          warnings — a clean parse is not the same claim as a sound graph.
