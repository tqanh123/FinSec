# secrets-inject.yaml — which (tool, field) pairs the secrets_inject hook scans
# for ${secret:REF} placeholders. Everything else passes through untouched:
# an undeclared tool or field is not scanned, by design — the injector reads
# only what this file names.
#
# A field's value must be a plain string for substitution (nested objects are
# left alone). Add a pair here only when its tool call genuinely carries the
# placeholder, or the hook pays a config read for nothing.

tools:
  Bash: [command]
  WebFetch: [url]
