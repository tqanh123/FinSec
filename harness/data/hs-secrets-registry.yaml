# hs-secrets-registry.yaml — base file of hs-secrets's command registry.
#
# The shipped commands live in hs-secrets-registry.d/*.yaml, one row each:
#
#   domains:
#     <command>: {module: secret_store.verbs.<file>, help: "<one line>"}
#
# A repo adds its own commands in `<project>/hs-secrets-registry.d/*.yaml`
# (the project layer of config-layers.yaml); a name two files declare is an
# error naming both, never a silent last-wins. This base file ships empty —
# every shipped row lives in the fragments dir beside it.

domains: {}
